<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AS 9618 - Transmission Media Quiz</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eef5ff, #f8fbff);
      color: #172033;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 18px 50px;
    }
    .header {
      background: #173f67;
      color: white;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(23,63,103,.15);
    }
    .header h1 { margin: 0 0 8px; font-size: 30px; }
    .header p { margin: 0; opacity: .9; }
    .progress-wrap {
      background: white;
      padding: 15px 18px;
      border-radius: 14px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }
    .progress-top {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .progress {
      height: 10px;
      background: #e6ebf2;
      border-radius: 10px;
      overflow: hidden;
    }
    #progressBar {
      height: 100%;
      width: 0%;
      background: #2388d9;
      transition: width .3s;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 6px 22px rgba(0,0,0,.08);
    }
    .question-number {
      color: #2388d9;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .question {
      font-size: 23px;
      line-height: 1.35;
      margin: 0 0 22px;
    }
    .options {
      display: grid;
      gap: 12px;
    }
    .option {
      width: 100%;
      padding: 15px 17px;
      border: 2px solid #dce3ec;
      background: #fff;
      border-radius: 12px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
      transition: .2s;
    }
    .option:hover:not(:disabled) {
      border-color: #2388d9;
      background: #f3f9ff;
      transform: translateY(-1px);
    }
    .option.correct {
      background: #e9f8ef;
      border-color: #35a866;
      color: #176b3d;
    }
    .option.wrong {
      background: #fff0f0;
      border-color: #d9534f;
      color: #9c2723;
    }
    .option:disabled { cursor: default; }
    .feedback {
      display: none;
      margin-top: 18px;
      padding: 15px 17px;
      border-radius: 12px;
      line-height: 1.5;
    }
    .feedback.show { display: block; }
    .feedback.correct {
      background: #e9f8ef;
      border-left: 5px solid #35a866;
    }
    .feedback.wrong {
      background: #fff0f0;
      border-left: 5px solid #d9534f;
    }
    .next-btn, .restart-btn {
      margin-top: 20px;
      border: 0;
      background: #173f67;
      color: white;
      padding: 13px 22px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .next-btn:hover, .restart-btn:hover { background: #0e2e4d; }
    .result {
      display: none;
      text-align: center;
    }
    .result.show { display: block; }
    .score {
      font-size: 58px;
      font-weight: bold;
      color: #173f67;
      margin: 10px 0;
    }
    .message {
      font-size: 19px;
      margin-bottom: 22px;
    }
    .review {
      margin-top: 25px;
      text-align: left;
      border-top: 1px solid #e2e7ee;
      padding-top: 20px;
    }
    .review-item {
      padding: 12px 0;
      border-bottom: 1px solid #edf0f4;
    }
    .review-item strong { display: block; margin-bottom: 5px; }
    .tag {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-right: 5px;
    }
    .twisted { background: #dceeff; color: #17639a; }
    .coaxial { background: #fff2b8; color: #806500; }
    .fibre { background: #ffe0c9; color: #a44700; }
    .footer {
      text-align: center;
      margin-top: 18px;
      color: #6b7280;
      font-size: 13px;
    }
    @media (max-width: 600px) {
      .header h1 { font-size: 24px; }
      .question { font-size: 20px; }
      .card { padding: 20px; }
    }
  </style>
</head>

<body>
<div class="container">

  <div class="header">
    <h1>AS 9618 — Transmission Media</h1>
    <p>10-question interactive quiz: Twisted Pair vs Coaxial vs Fibre Optic</p>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-top">
      <span id="progressText">Question 1 of 10</span>
      <span id="scoreText">Score: 0</span>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
  </div>

  <div class="card" id="quizCard">
    <div class="question-number" id="questionNumber"></div>
    <h2 class="question" id="question"></h2>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" style="display:none;">Next Question →</button>
  </div>

  <div class="card result" id="resultCard">
    <h2>Quiz Complete!</h2>
    <div class="score" id="finalScore"></div>
    <div class="message" id="finalMessage"></div>
    <div class="review" id="review"></div>
    <button class="restart-btn" onclick="restartQuiz()">Try Again</button>
  </div>

  <div class="footer">
    AS 9618 Computer Science • Transmission Media
  </div>
</div>

<script>
const questions = [
  {
    q: "Which transmission medium is commonly used for LAN connections in homes and offices?",
    options: ["Twisted pair cable", "Coaxial cable", "Fibre optic cable", "Satellite"],
    answer: 0,
    explanation: "Twisted pair is commonly used to connect desktop PCs, printers and servers in LANs.",
    tag: "Twisted pair"
  },
  {
    q: "Which transmission medium uses LIGHT signals to transmit data?",
    options: ["Twisted pair", "Coaxial cable", "Fibre optic", "All three"],
    answer: 2,
    explanation: "Fibre optic uses pulses of light. Twisted pair and coaxial cable use electrical signals.",
    tag: "Fibre optic"
  },
  {
    q: "Which medium generally has the HIGHEST bandwidth?",
    options: ["Twisted pair", "Coaxial cable", "Fibre optic", "They are all the same"],
    answer: 2,
    explanation: "Fibre optic has the highest bandwidth of these three media.",
    tag: "Fibre optic"
  },
  {
    q: "Which medium is MOST affected by electromagnetic interference (EMI)?",
    options: ["Twisted pair", "Coaxial cable", "Fibre optic", "All are equally affected"],
    answer: 0,
    explanation: "Twisted pair is prone to electromagnetic interference. Coaxial can also suffer from interference, while fibre optic is not affected by electromagnetic interference.",
    tag: "Twisted pair"
  },
  {
    q: "A school wants a CHEAP connection between PCs and printers in a LAN. Which is the most suitable choice?",
    options: ["Fibre optic", "Twisted pair", "Satellite", "Coaxial only"],
    answer: 1,
    explanation: "Twisted pair is relatively cheap and is commonly used for LAN connections.",
    tag: "Twisted pair"
  },
  {
    q: "Which medium is most suitable for a HIGH-SPEED, LONG-DISTANCE internet backbone?",
    options: ["Twisted pair", "Coaxial cable", "Fibre optic", "None of them"],
    answer: 2,
    explanation: "Fibre optic provides very high bandwidth, high speed and minimal signal degradation over long distances.",
    tag: "Fibre optic"
  },
  {
    q: "Which statement about coaxial cable is correct?",
    options: [
      "It uses light signals and has the highest bandwidth.",
      "It uses electrical signals and has lower bandwidth than fibre optic.",
      "It cannot carry network traffic.",
      "It is not affected by any type of interference."
    ],
    answer: 1,
    explanation: "Coaxial uses electrical signals. It has lower bandwidth and is slower than fibre optic, and it can suffer from interference.",
    tag: "Coaxial"
  },
  {
    q: "Which medium is generally the MOST expensive of the three?",
    options: ["Twisted pair", "Coaxial cable", "Fibre optic", "They cost the same"],
    answer: 2,
    explanation: "Fibre optic is generally more expensive than twisted pair and coaxial cable.",
    tag: "Fibre optic"
  },
  {
    q: "Which comparison is correct?",
    options: [
      "Twisted pair → light signals; Fibre optic → electrical signals",
      "Coaxial → light signals; Twisted pair → electrical signals",
      "Twisted pair → electrical signals; Fibre optic → light signals",
      "All three use light signals"
    ],
    answer: 2,
    explanation: "Twisted pair and coaxial transmit electrical signals. Fibre optic transmits light signals.",
    tag: "All"
  },
  {
    q: "A company needs a medium with MINIMAL SIGNAL DEGRADATION over a long distance. Which should they choose?",
    options: ["Twisted pair", "Coaxial cable", "Fibre optic", "Any of the three"],
    answer: 2,
    explanation: "Fibre optic has minimal signal degradation and is suitable for long-distance, high-speed data transmission.",
    tag: "Fibre optic"
  }
];

let current = 0;
let score = 0;
let userAnswers = [];

const qNumber = document.getElementById("questionNumber");
const question = document.getElementById("question");
const options = document.getElementById("options");
const feedback = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");
const scoreText = document.getElementById("scoreText");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function loadQuestion() {
  const q = questions[current];

  qNumber.textContent = `Question ${current + 1}`;
  question.textContent = q.q;
  options.innerHTML = "";
  feedback.className = "feedback";
  feedback.innerHTML = "";
  nextBtn.style.display = "none";

  progressText.textContent = `Question ${current + 1} of ${questions.length}`;
  scoreText.textContent = `Score: ${score}`;
  progressBar.style.width = `${(current / questions.length) * 100}%`;

  q.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.className = "option";
    button.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
    button.onclick = () => selectAnswer(index, button);
    options.appendChild(button);
  });
}

function selectAnswer(selected, selectedButton) {
  const q = questions[current];
  const allButtons = document.querySelectorAll(".option");

  allButtons.forEach(btn => btn.disabled = true);

  userAnswers.push(selected);

  if (selected === q.answer) {
    score++;
    selectedButton.classList.add("correct");
    feedback.className = "feedback correct show";
    feedback.innerHTML = `<strong>✓ Correct!</strong><br>${q.explanation}`;
  } else {
    selectedButton.classList.add("wrong");
    allButtons[q.answer].classList.add("correct");
    feedback.className = "feedback wrong show";
    feedback.innerHTML = `<strong>✗ Not quite.</strong><br><strong>Correct answer:</strong> ${q.options[q.answer]}<br>${q.explanation}`;
  }

  scoreText.textContent = `Score: ${score}`;
  progressBar.style.width = `${((current + 1) / questions.length) * 100}%`;
  nextBtn.style.display = "inline-block";
}

nextBtn.onclick = () => {
  current++;
  if (current < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
};

function showResult() {
  document.getElementById("quizCard").style.display = "none";
  document.getElementById("progressWrap").style.display = "none";
  document.getElementById("resultCard").classList.add("show");

  document.getElementById("finalScore").textContent = `${score} / ${questions.length}`;

  let message = "";
  if (score === 10) {
    message = "Excellent! You can clearly distinguish the three transmission media.";
  } else if (score >= 8) {
    message = "Very good! Review the questions you missed and check the key differences.";
  } else if (score >= 6) {
    message = "Good start. Review speed, bandwidth, interference and typical uses.";
  } else {
    message = "Review the comparison table and try the quiz again.";
  }
  document.getElementById("finalMessage").textContent = message;

  const review = document.getElementById("review");
  review.innerHTML = "<h3>Key differences to remember</h3>";

  review.innerHTML += `
    <div class="review-item">
      <strong><span class="tag twisted">TWISTED PAIR</span></strong>
      Electrical signals • Cheap • LANs • Low–medium bandwidth • Prone to EMI
    </div>
    <div class="review-item">
      <strong><span class="tag coaxial">COAXIAL</span></strong>
      Electrical signals • Medium cost • Lower bandwidth than fibre • Can suffer from interference
    </div>
    <div class="review-item">
      <strong><span class="tag fibre">FIBRE OPTIC</span></strong>
      Light signals • Fastest • Highest bandwidth • Minimal degradation • No electromagnetic interference • Expensive
    </div>
  `;
}

function restartQuiz() {
  current = 0;
  score = 0;
  userAnswers = [];
  document.getElementById("resultCard").classList.remove("show");
  document.getElementById("quizCard").style.display = "block";
  document.getElementById("progressWrap").style.display = "block";
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
