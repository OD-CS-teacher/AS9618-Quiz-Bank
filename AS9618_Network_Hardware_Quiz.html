<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AS 9618 Network Hardware Quiz</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f9;color:#17212b}.wrap{max-width:850px;margin:auto;padding:24px 16px 50px}.header{background:#17365d;color:#fff;padding:28px;border-radius:16px;margin-bottom:18px}.header h1{margin:0 0 8px}.info,.card,.result{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #0001}.row{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:10px}.bar{height:9px;background:#e3e8ed;border-radius:20px;overflow:hidden}.fill{height:100%;background:#2f75b5;width:0;transition:.3s}.topic{font-size:12px;font-weight:bold;color:#687582;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}.q{font-size:20px;font-weight:bold;line-height:1.45;margin-bottom:18px}.opt{display:block;border:2px solid #d6dde4;border-radius:10px;padding:13px 15px;margin:10px 0;cursor:pointer}.opt:hover{background:#f7fafc}.correct{border-color:#2e7d32;background:#edf7ee}.wrong{border-color:#c62828;background:#fff0f0}.feedback{display:none;margin-top:16px;padding:13px 15px;border-radius:9px;line-height:1.5}.show{display:block}.good{background:#edf7ee;color:#1b5e20}.bad{background:#fff3e0;color:#7a4b00}button{border:0;border-radius:9px;padding:11px 18px;font-weight:bold;cursor:pointer;margin:8px 8px 0 0}.primary{background:#17365d;color:#fff}.secondary{background:#e8edf2;color:#17365d}button:disabled{opacity:.45;cursor:not-allowed}.result{display:none;text-align:center}.score{font-size:46px;font-weight:800;color:#17365d}.review{text-align:left;margin-top:22px;border-top:1px solid #ddd}.review div{padding:13px 0;border-bottom:1px solid #e3e6e9}.small{color:#687582;font-size:13px}@media(max-width:600px){.wrap{padding:14px 10px 35px}.q{font-size:18px}}</style></head><body><div class="wrap"><div class="header"><h1>AS 9618 — Network Hardware</h1><p>Chapter 2 • Interactive 15-question quiz</p></div><div class="info"><b>Instructions:</b> Select one answer. Each question is worth <b>1 mark</b>.</div><div class="info"><div class="row"><span id="prog"></span><span id="score">Score: 0</span></div><div class="bar"><div class="fill" id="fill"></div></div></div><div id="quiz"></div><div class="result" id="result"><h2>Quiz Complete!</h2><div class="score" id="final"></div><p id="msg"></p><button class="primary" onclick="restart()">Try Again</button><div class="review" id="review"></div></div></div><script>const qs=[{topic:'Switch',q:'What is the main function of a network switch?',options:['To connect devices and forward data to the intended destination device', 'To provide services and resources to client computers', 'To connect a device to a wireless network', 'To boost a weak signal'],answer:0,explanation:'A switch connects devices and forwards data to the destination device.'},{topic:'Switch',q:'A switch receives a data packet. Which address does it examine to decide which port to use?',options:['The destination IP address', 'The destination MAC address', 'The public IP address of the ISP', 'The server address'],answer:1,explanation:'The switch examines the destination MAC address and uses its lookup table.'},{topic:'Hub vs Switch',q:'What happens when a hub receives a data packet?',options:['It sends the data only to the intended device', 'It sends the data to every device connected to it', 'It sends the data to the nearest router only', 'It changes the packet into a wireless signal'],answer:1,explanation:'A hub broadcasts the received data to every connected device.'},{topic:'Server',q:'Which statement best describes a server?',options:['A device that only provides Wi-Fi', 'A powerful computer that provides services or resources to clients', 'A device that only regenerates weak signals', 'A device that connects two LAN segments using MAC addresses'],answer:1,explanation:'A server provides services or resources such as files, websites, printers or applications.'},{topic:'Server',q:'Which is an example of a server?',options:['File server', 'Network cable', 'Repeater cable', 'MAC port'],answer:0,explanation:'Examples include file server, print server, web server and mail server.'},{topic:'NIC',q:'What is the primary function of a Network Interface Card (NIC)?',options:['To route packets between different networks', 'To send and receive data packets between a device and the network', 'To broadcast packets to every device', 'To provide satellite communication'],answer:1,explanation:'The primary function of a NIC is to send and receive data packets between the device and the network.'},{topic:'NIC',q:'Which unique identifier is associated with every NIC?',options:['IP route', 'MAC address', 'WAP address', 'Port number only'],answer:1,explanation:'Every NIC has a unique MAC address used to identify the device.'},{topic:'WNIC',q:'What is the main purpose of a Wireless Network Interface Card (WNIC)?',options:['To connect a device to a wireless network', 'To connect two wired LANs', 'To route packets between WANs', 'To regenerate a weak signal'],answer:0,explanation:'A WNIC allows a device to connect to a wireless network such as Wi-Fi.'},{topic:'WAP',q:'What is the role of a Wireless Access Point (WAP)?',options:['It acts as a bridge between wired and wireless parts of a network', 'It stores all files for a network', 'It replaces every network switch', 'It assigns every public IP address on the Internet'],answer:0,explanation:'A WAP acts like a bridge between the wired and wireless parts of a network.'},{topic:'Bridge',q:'What is the main function of a network bridge?',options:['To connect two separate network segments together', 'To connect a computer directly to Wi-Fi', 'To route packets through several WANs', 'To boost wireless signals'],answer:0,explanation:'A bridge connects two separate network segments and can join two LANs.'},{topic:'Repeater',q:'What does a repeater do?',options:['Receives a weak signal and retransmits it', 'Examines MAC addresses and selects a switch port', 'Provides files to client computers', 'Assigns a public IP address'],answer:0,explanation:'A repeater receives a weak signal and retransmits it to extend its range.'},{topic:'Router',q:'What is the main role of a router?',options:['To connect networks and route packets towards their destinations', 'To send every packet to every device', 'To provide only wireless keyboard connections', 'To store files for all clients'],answer:0,explanation:'A router joins networks together and analyses packets to determine the path to the destination.'},{topic:'Router',q:'Which address does a router read in the packet header to determine the intended destination?',options:['Destination IP address', 'Destination MAC address only', 'Ethernet cable number', 'WAP frequency'],answer:0,explanation:'The router reads the destination IP address in the packet header.'},{topic:'Router',q:'A packet passes from one router to another on its journey to the destination. What is this passage called?',options:['A hop', 'A frame', 'A bridge', 'A broadcast'],answer:0,explanation:'Each pass from router to router is called a hop.'},{topic:'Router',q:'What does a router use to determine the next network where a packet should be sent?',options:['A routing table', 'A WNIC', 'A hub broadcast table', 'A server operating system'],answer:0,explanation:'The router looks up the IP address in a routing table to determine the next network.'}];let i=0,score=0,answers=[];function render(){let q=qs[i];document.getElementById('prog').textContent=`Question ${i+1} of ${qs.length}`;document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('fill').style.width=((i+1)/qs.length*100)+'%';document.getElementById('quiz').innerHTML=`<div class="card"><div class="topic">${q.topic}</div><div class="q">${q.q}</div>${q.options.map((x,n)=>`<label class="opt" id="o${n}"><input type="radio" name="a" value="${n}"> ${x}</label>`).join('')}<div class="feedback" id="fb"></div><button class="primary" id="check" onclick="check()">Check Answer</button><button class="secondary" id="next" onclick="next()" disabled>${i===qs.length-1?'Finish Quiz':'Next Question'}</button></div>`}function check(){let s=document.querySelector('input[name=a]:checked');if(!s){alert('Please select an answer first.');return}let a=+s.value,q=qs[i];answers[i]=a;document.querySelectorAll('.opt').forEach((e,n)=>{e.style.pointerEvents='none';if(n===q.answer)e.classList.add('correct');if(n===a&&a!==q.answer)e.classList.add('wrong')});let fb=document.getElementById('fb');if(a===q.answer){score++;fb.className='feedback show good';fb.innerHTML='<b>Correct!</b> '+q.explanation}else{fb.className='feedback show bad';fb.innerHTML='<b>Incorrect.</b> '+q.explanation}document.getElementById('score').textContent=`Score: ${score}`;document.getElementById('check').disabled=true;document.getElementById('next').disabled=false}function next(){if(i<qs.length-1){i++;render()}else{show()}}function show(){document.getElementById('quiz').style.display='none';document.querySelectorAll('.info').forEach(x=>x.style.display='none');document.getElementById('result').style.display='block';document.getElementById('final').textContent=`${score} / ${qs.length}`;let p=score/qs.length*100;document.getElementById('msg').textContent=p>=80?'Excellent — strong understanding of network hardware.':p>=60?'Good work — review the questions you missed.':'Keep practising — review the purpose and function of each device.';let r=document.getElementById('review');r.innerHTML='<h3>Review</h3>'+qs.map((q,n)=>`<div><b>Q${n+1} — ${answers[n]===q.answer?'Correct':'Incorrect'}</b><br><span class="small">${q.topic}</span><br>${q.q}<br><b>Correct answer:</b> ${q.options[q.answer]}</div>`).join('')}function restart(){i=0;score=0;answers=[];document.getElementById('quiz').style.display='block';document.querySelectorAll('.info').forEach(x=>x.style.display='block');document.getElementById('result').style.display='none';render()}render();</script></body></html>
